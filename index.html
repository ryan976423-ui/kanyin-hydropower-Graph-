
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANYIN HYDROPOWER</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #05080e;
    color: white;
}

/* LOGIN */
#login {
    min-height: 100vh;
    background: linear-gradient(135deg, #dff6ff, #8bd5ff);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.brand {
    text-align: center;
    margin-bottom: 30px;
}

.brand h1 {
    color: #003c65;
    font-size: 48px;
    letter-spacing: 8px;
    animation: slideIn 1.8s ease;
}

.brand h2 {
    color: #087db9;
    letter-spacing: 5px;
    margin-top: 8px;
    animation: slideIn 2.5s ease;
}

@keyframes slideIn {
    from { transform: translateX(100vw); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.login-box {
    width: 320px;
    padding: 30px;
    background: rgba(255,255,255,.85);
    border-radius: 18px;
    text-align: center;
}

.login-box h3 {
    color: #00466e;
    margin-bottom: 20px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #8acbe9;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 16px;
}

.login-box button {
    width: 100%;
    padding: 13px;
    border: none;
    background: #007dbb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

#error {
    color: red;
    margin-top: 12px;
}

/* DASHBOARD */
#dashboard {
    display: none;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 25px;
}

.header h1 {
    color: #00d5ff;
    text-shadow: 0 0 12px #00aaff;
}

.header button {
    background: #e63946;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

/* PANELS */
.panel {
    background: #101a29;
    border: 1px solid #1e3b55;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(0,180,255,.08);
}

.graph-title {
    text-align: center;
    color: #00d5ff;
    font-size: 25px;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-shadow: 0 0 12px #00aaff;
}

.panel h2:not(.graph-title) {
    color: #00d5ff;
    margin-bottom: 18px;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
}

select, input, textarea {
    background: #07111e;
    color: white;
    border: 1px solid #31516d;
    padding: 10px;
    border-radius: 6px;
}

select:disabled {
    opacity: .5;
}

.chart-container {
    position: relative;
    width: 100%;
    height: 430px;
}

#periodInfo {
    color: #9eb6ca;
    margin-top: 12px;
}

/* TABLE */
.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th, td {
    border: 1px solid #29445c;
    padding: 11px;
    text-align: center;
}

th {
    background: #12304a;
    color: #00d5ff;
}

td {
    background: #0a1420;
}

.remark-cell {
    text-align: left;
    white-space: pre-wrap;
    min-width: 180px;
    max-width: 300px;
    overflow-wrap: anywhere;
    color: #d8e8f5;
}

.action-btn {
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    margin: 3px;
}

.edit-btn { background: #087db9; }
.delete-btn { background: #d62828; }
.note-btn { background: #008f65; }

/* ADMIN */
.admin-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}

.admin-form input {
    width: 100%;
}

.admin-form textarea {
    width: 100%;
    min-height: 75px;
    resize: vertical;
    grid-column: 1 / -1;
}

.main-btn {
    background: #00a86b;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
}

#note {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    margin: 10px 0;
}

.note-display {
    white-space: pre-wrap;
    line-height: 1.7;
    color: #d8e8f5;
}

@media(max-width:600px) {
    .brand h1 { font-size: 34px; }
    #dashboard { padding: 10px; }
    .chart-container { height: 350px; }
    .graph-title { font-size: 19px; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login">
    <div class="brand">
        <h1>KANYIN</h1>
        <h2>HYDROPOWER</h2>
    </div>

    <div class="login-box">
        <h3>LOGIN SYSTEM</h3>
        <input type="password" id="pass" placeholder="Enter Password"
        onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()">LOGIN</button>
        <p id="error"></p>
    </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard">

    <div class="header">
        <h1>KANYIN HYDROPOWER</h1>
        <div>
            <span id="role"></span>
            <button onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <!-- GRAPH -->
    <div class="panel">
        <h2 class="graph-title">KANYIN HYDROPOWER</h2>

        <div class="filters">
            <label>PERIOD</label>
            <select id="period" onchange="updateGraph()">
                <option value="daily">DAILY</option>
                <option value="monthly">MONTHLY</option>
                <option value="yearly">YEARLY</option>
            </select>

            <label>YEAR</label>
            <select id="yearSelect" onchange="updateGraph()"></select>

            <label>MONTH</label>
            <select id="monthSelect" onchange="updateGraph()">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>

        <div class="chart-container">
            <canvas id="graph"></canvas>
        </div>

        <p id="periodInfo"></p>
    </div>

    <!-- DATA TABLE -->
    <div class="panel">
        <h2>DAILY RECORDS & REMARKS</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>MWh</th>
                        <th>Water Level (m)</th>
                        <th>DAILY REMARKS</th>
                        <th id="actionHeading">ACTION</th>
                    </tr>
                </thead>

                <tbody id="records"></tbody>
            </table>
        </div>
    </div>

    <!-- ADMIN DATA ENTRY -->
    <div class="panel" id="adminPanel">
        <h2>ADMIN - DATA ENTRY</h2>

        <div class="admin-form">
            <input type="date" id="date">
            <input type="number" id="mwh" placeholder="MWh" step="any">
            <input type="number" id="water" placeholder="Water Level (m)" step="any">

            <textarea id="dailyRemark"
            placeholder="Write daily remark for this date..."></textarea>

            <button class="main-btn" onclick="saveData()">
                SAVE DATA & REMARK
            </button>
        </div>
    </div>

    <!-- GENERAL REMARKS -->
    <div class="panel">
        <h2>GENERAL REMARKS / NOTES</h2>

        <div id="noteView" class="note-display"></div>

        <div id="noteEditor">
            <textarea id="note" placeholder="Write general remarks here..."></textarea>
            <button class="main-btn" onclick="saveNote()">SAVE REMARKS</button>
        </div>
    </div>

</section>

<script>

/* PASSWORDS */
const VIEWER_PASSWORD = "kanyin2024";
const ADMIN_PASSWORD = "ryan7667";

let currentRole = "";

let data = JSON.parse(localStorage.getItem("kanyinData") || "[]");

let savedNote = localStorage.getItem("kanyinNote") || "";

let chart = null;

/* LOGIN */
function login() {
    const password = document.getElementById("pass").value;

    if (password === ADMIN_PASSWORD) {
        currentRole = "ADMIN";
    } else if (password === VIEWER_PASSWORD) {
        currentRole = "VIEWER";
    } else {
        document.getElementById("error").innerText = "Incorrect Password!";
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    document.getElementById("role").innerText = " | " + currentRole;

    document.getElementById("adminPanel").style.display =
        currentRole === "ADMIN" ? "block" : "none";

    document.getElementById("noteEditor").style.display =
        currentRole === "ADMIN" ? "block" : "none";

    document.getElementById("actionHeading").style.display =
        currentRole === "ADMIN" ? "table-cell" : "none";

    setupFilters();
    renderTable();
    renderNote();
    updateGraph();
}

/* LOGOUT */
function logout() {
    currentRole = "";

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "flex";

    document.getElementById("pass").value = "";
    document.getElementById("error").innerText = "";
}

/* FILTERS */
function setupFilters() {
    const yearSelect = document.getElementById("yearSelect");
    const currentDate = new Date();

    const years = new Set(
        data.map(item => Number(item.date.substring(0, 4)))
    );

    years.add(currentDate.getFullYear());

    yearSelect.innerHTML = "";

    [...years].sort((a, b) => b - a).forEach(year => {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
    });

    yearSelect.value = currentDate.getFullYear();

    document.getElementById("monthSelect").value =
        currentDate.getMonth() + 1;
}

/* SAVE DATA AND DAILY REMARK */
function saveData() {
    if (currentRole !== "ADMIN") return;

    const date = document.getElementById("date").value;
    const mwhInput = document.getElementById("mwh").value;
    const waterInput = document.getElementById("water").value;
    const dailyRemark = document.getElementById("dailyRemark").value;

    const mwh = Number(mwhInput);
    const water = Number(waterInput);

    if (!date || mwhInput === "" || waterInput === "" ||
        !Number.isFinite(mwh) || !Number.isFinite(water)) {
        alert("Please fill in Date, MWh and Water Level!");
        return;
    }

    if (mwh < 0 || water < 0) {
        alert("Values cannot be negative!");
        return;
    }

    const index = data.findIndex(item => item.date === date);

    // Keep an existing remark if the new remark box is left empty.
    const oldRemark = index >= 0 ? (data[index].remark || "") : "";

    const record = {
        date: date,
        mwh: mwh,
        water: water,
        remark: dailyRemark.trim() || oldRemark
    };

    if (index >= 0) {
        data[index] = record;
    } else {
        data.push(record);
    }

    data.sort((a, b) => a.date.localeCompare(b.date));

    localStorage.setItem("kanyinData", JSON.stringify(data));

    document.getElementById("date").value = "";
    document.getElementById("mwh").value = "";
    document.getElementById("water").value = "";
    document.getElementById("dailyRemark").value = "";

    setupFilters();
    renderTable();
    updateGraph();

    alert("Data and Daily Remark Saved!");
}

/* EDIT DATA */
function editData(date) {
    if (currentRole !== "ADMIN") return;

    const item = data.find(record => record.date === date);
    if (!item) return;

    document.getElementById("date").value = item.date;
    document.getElementById("mwh").value = item.mwh;
    document.getElementById("water").value = item.water;
    document.getElementById("dailyRemark").value = item.remark || "";

    document.getElementById("adminPanel").scrollIntoView({
        behavior: "smooth"
    });
}

/* EDIT DAILY REMARK ONLY */
function editDailyRemark(date) {
    if (currentRole !== "ADMIN") return;

    const item = data.find(record => record.date === date);
    if (!item) return;

    const newRemark = prompt(
        "Write or edit remark for " + date,
        item.remark || ""
    );

    if (newRemark === null) return;

    item.remark = newRemark.trim();

    localStorage.setItem("kanyinData", JSON.stringify(data));

    renderTable();

    alert("Daily Remark Updated!");
}

/* DELETE DAILY REMARK ONLY */
function deleteDailyRemark(date) {
    if (currentRole !== "ADMIN") return;

    const item = data.find(record => record.date === date);
    if (!item || !item.remark) return;

    if (!confirm("Delete remark for " + date + "?")) return;

    item.remark = "";

    localStorage.setItem("kanyinData", JSON.stringify(data));

    renderTable();
}

/* DELETE DATA */
function deleteData(date) {
    if (currentRole !== "ADMIN") return;

    if (!confirm("Are you sure you want to delete this record?")) return;

    data = data.filter(item => item.date !== date);

    localStorage.setItem("kanyinData", JSON.stringify(data));

    setupFilters();
    renderTable();
    updateGraph();
}

/* TABLE */
function renderTable() {
    const tbody = document.getElementById("records");
    tbody.innerHTML = "";

    [...data].sort((a, b) => b.date.localeCompare(a.date))
    .forEach(item => {
        const tr = document.createElement("tr");

        const remarkCell = document.createElement("td");
        remarkCell.className = "remark-cell";
        remarkCell.textContent = item.remark || "—";

        tr.innerHTML = `
            <td>${item.date}</td>
            <td>${item.mwh.toLocaleString()}</td>
            <td>${item.water}</td>
        `;

        tr.appendChild(remarkCell);

        if (currentRole === "ADMIN") {
            const actionCell = document.createElement("td");

            actionCell.innerHTML = `
                <button class="action-btn note-btn"
                    onclick="editDailyRemark('${item.date}')">
                    NOTE
                </button>

                <button class="action-btn edit-btn"
                    onclick="editData('${item.date}')">
                    EDIT
                </button>

                <button class="action-btn delete-btn"
                    onclick="deleteDailyRemark('${item.date}')">
                    DEL NOTE
                </button>

                <button class="action-btn delete-btn"
                    onclick="deleteData('${item.date}')">
                    DELETE DATA
                </button>
            `;

            tr.appendChild(actionCell);
        }

        tbody.appendChild(tr);
    });
}

/* GENERAL REMARKS */
function saveNote() {
    if (currentRole !== "ADMIN") return;

    savedNote = document.getElementById("note").value;

    localStorage.setItem("kanyinNote", savedNote);

    renderNote();
    alert("General Remarks Saved!");
}

function renderNote() {
    document.getElementById("noteView").textContent = savedNote;
    document.getElementById("note").value = savedNote;
}

/* GRAPH */
function updateGraph() {
    const period = document.getElementById("period").value;
    const selectedYear = Number(document.getElementById("yearSelect").value);
    const selectedMonth = Number(document.getElementById("monthSelect").value);

    document.getElementById("monthSelect").disabled = period !== "daily";
    document.getElementById("yearSelect").disabled = period === "yearly";

    let labels = [];
    let mwhValues = [];
    let waterValues = [];

    /* DAILY */
    if (period === "daily") {
        const daysInMonth = new Date(
            selectedYear, selectedMonth, 0
        ).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
            const dateKey =
                `${selectedYear}-${String(selectedMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

            labels.push(String(day));

            const record = data.find(item => item.date === dateKey);

            mwhValues.push(record ? record.mwh : null);
            waterValues.push(record ? record.water : null);
        }

        document.getElementById("periodInfo").innerText =
            `DAILY GRAPH: ${selectedYear} / ${selectedMonth} - ${daysInMonth} DAYS`;
    }

    /* MONTHLY */
    else if (period === "monthly") {
        const monthNames = [
            "January", "February", "March", "April",
            "May", "June", "July", "August",
            "September", "October", "November", "December"
        ];

        for (let month = 1; month <= 12; month++) {
            labels.push(monthNames[month - 1]);

            const records = data.filter(item =>
                Number(item.date.substring(0, 4)) === selectedYear &&
                Number(item.date.substring(5, 7)) === month
            );

            const totalMwh = records.reduce((sum, item) => sum + item.mwh, 0);

            const averageWater = records.length
                ? records.reduce((sum, item) => sum + item.water, 0) / records.length
                : null;

            mwhValues.push(records.length ? totalMwh : null);
            waterValues.push(averageWater);
        }

        document.getElementById("periodInfo").innerText =
            `MONTHLY GRAPH: ${selectedYear}`;
    }

    /* YEARLY */
    else {
        const years = [...new Set(
            data.map(item => Number(item.date.substring(0, 4)))
        )].sort((a, b) => a - b);

        if (years.length === 0) {
            years.push(new Date().getFullYear());
        }

        years.forEach(year => {
            labels.push(String(year));

            const records = data.filter(item =>
                Number(item.date.substring(0, 4)) === year
            );

            const totalMwh = records.reduce((sum, item) => sum + item.mwh, 0);

            const averageWater = records.length
                ? records.reduce((sum, item) => sum + item.water, 0) / records.length
                : null;

            mwhValues.push(records.length ? totalMwh : null);
            waterValues.push(averageWater);
        });

        document.getElementById("periodInfo").innerText = "YEARLY GRAPH";
    }

    if (chart) chart.destroy();

    const ctx = document.getElementById("graph").getContext("2d");

    chart = new Chart(ctx, {
        type: "line",

        data: {
            labels: labels,

            datasets: [
                {
                    label: "MWh",
                    data: mwhValues,
                    yAxisID: "y",
                    borderColor: "#00A8FF",
                    backgroundColor: "rgba(0,168,255,0.15)",
                    borderWidth: 3,
                    tension: 0.35,
                    pointRadius: 3,
                    pointHoverRadius: 8,
                    spanGaps: true
                },
                {
                    label: "Water Level (m)",
                    data: waterValues,
                    yAxisID: "y1",
                    borderColor: "#FF1744",
                    backgroundColor: "rgba(255,23,68,0.12)",
                    borderWidth: 3,
                    tension: 0.35,
                    pointRadius: 3,
                    pointHoverRadius: 8,
                    spanGaps: true
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
                mode: "index",
                intersect: false
            },

            plugins: {
                legend: {
                    labels: {
                        color: "white",
                        font: {
                            size: 13,
                            weight: "bold"
                        }
                    }
                }
            },

            scales: {
                x: {
                    position: "bottom",

                    title: {
                        display: true,
                        text: period === "daily"
                            ? "DATE (1 - END OF MONTH)"
                            : period === "monthly" ? "MONTH" : "YEAR",
                        color: "#39FF14",
                        font: {
                            size: 14,
                            weight: "bold"
                        }
                    },

                    ticks: {
                        color: "#FFFFFF",
                        autoSkip: false,
                        maxRotation: 60,
                        minRotation: 45
                    },

                    grid: {
                        display: true,
                        color: "#39FF14",
                        lineWidth: 1
                    },

                    border: {
                        color: "#39FF14",
                        width: 2
                    }
                },

                y: {
                    type: "linear",
                    position: "left",

                    title: {
                        display: true,
                        text: "MWh",
                        color: "#00A8FF"
                    },

                    ticks: {
                        color: "#00A8FF"
                    },

                    grid: {
                        display: true,
                        color: "rgba(57,255,20,0.45)",
                        lineWidth: 1
                    },

                    border: {
                        color: "#39FF14",
                        width: 2
                    }
                },

                y1: {
                    type: "linear",
                    position: "right",

                    title: {
                        display: true,
                        text: "WATER LEVEL (m)",
                        color: "#FF1744"
                    },

                    ticks: {
                        color: "#FF1744"
                    },

                    grid: {
                        drawOnChartArea: false
                    },

                    border: {
                        color: "#39FF14",
                        width: 2
                    }
                }
            }
        }
    });
}

</script>

</body>
</html>
